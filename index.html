<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <form id="taskForm" style="background-color: green">
        <input type="text" id="taskName" name="taskName" />
        <input type="date" id="dot" name="dot" />
        <button id="priorityBtn">
          <i class="fas fa-flag"></i>
        </button>
        <button id="addTaskBtn" type="submit" disabled>+</button>
      </form>

      <div id="tasksContainer"></div>
    </div>

    <!-- For Priority Modals -->
    <dialog id="priorityModal">
      <button id="closeModalBtn" aria-label="close" class="close-btn">
        <i class="fas fa-times"></i>
      </button>
      <h3>Priority</h3>
      <form id="priorityForm" method="dialog">
        <div class="priority-options">
          <label>
            <input
              type="radio"
              name="priority"
              value="high"
              onclick="closeModal()"
            />
            <i class="fas fa-flag" style="color: #ff4d4d"></i>
          </label>
          <label>
            <input
              type="radio"
              name="priority"
              value="medium"
              onclick="closeModal()"
            />
            <i class="fas fa-flag" style="color: #ffcc00"></i>
          </label>
          <label>
            <input
              type="radio"
              name="priority"
              value="low"
              onclick="closeModal()"
            />
            <i class="fas fa-flag" style="color: #3399ff"></i>
          </label>
          <label>
            <input
              type="radio"
              name="priority"
              value="none"
              onclick="closeModal()"
              checked
            />
            <i class="fas fa-flag" style="color: #cccccc"></i>
          </label>
        </div>
      </form>
    </dialog>
    <script src="/script.js"></script>
  </body>
</html>

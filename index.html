<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="app-wrapper">
      <div class="container glass">
        <h2 class="app-title">My Tasks</h2>

        <form id="taskForm" class="task-form">
          <input
            type="text"
            id="taskName"
            name="taskName"
            placeholder="Add a task..."
          />

          <div class="date-wrapper">
            <input type="date" id="dot" name="dot" />
            <i class="fas fa-calendar"></i>
          </div>

          <button id="priorityBtn" class="icon-btn" type="button">
            <i class="fas fa-flag"></i>
          </button>

          <button id="addTaskBtn" type="submit" disabled class="add-btn">
            <i class="fas fa-plus"></i>
          </button>
        </form>

        <div id="tasksContainer"></div>
      </div>
    </div>

    <!-- For Priority Modals -->
    <dialog id="priorityModal">
      <button
        type="button"
        id="closeModalBtn"
        class="close-btn"
        aria-label="Close"
      >
        <i class="fas fa-times"></i>
      </button>
      <form id="priorityForm" method="dialog">
        <div class="priority-options">
          <label>
            <input type="radio" name="priority" value="high" />
            <i class="fas fa-flag high"></i>
          </label>
          <label>
            <input type="radio" name="priority" value="medium" />
            <i class="fas fa-flag medium"></i>
          </label>
          <label>
            <input type="radio" name="priority" value="low" />
            <i class="fas fa-flag low"></i>
          </label>
          <label>
            <input type="radio" name="priority" value="none" checked />
            <i class="fas fa-flag none"></i>
          </label>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
